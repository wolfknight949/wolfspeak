# Push a tag like `v1.3.0` → builds WolfSpeak, packs it with Velopack and publishes a GitHub Release.
# Every installed WolfSpeak picks the new version up automatically.
name: Release
run-name: Release ${{ github.event.inputs.version || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.3.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Actions pinned to exact commits (tags can be moved); comments show the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build, pack and upload
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env, never pasted into the script, so a crafted input can't inject commands.
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:TAG_NAME }
          $version = $version.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3 (got '$version')" }
          ./scripts/release.ps1 -Version $version -Upload -RepoUrl "https://github.com/$env:REPOSITORY"
